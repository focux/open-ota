  '@prisma/dev>@hono/node-server': 1.19.17
  '@prisma/dev>valibot': 1.4.2
  lodash@<4.18.1: 4.18.1

catalog:
  '@effect/platform-node': 4.0.0-rc.112
  '@effect/sql-d1': 4.0.0-rc.112
  '@effect/sql-sqlite-node': 4.0.0-rc.112
  alchemy: 2.0.0-beta.76
  effect: 4.0.0-rc.112
