name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      # The bsdiff engine is Rust compiled to WebAssembly. Its pinned toolchain
      # comes from packages/bsdiff/crate/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/bsdiff/crate
      # The crate must build for wasm32. The committed module is what ships;
      # builds are not byte-identical across hosts, so it is not diffed here.
      - run: pnpm --filter @open-ota/bsdiff build:wasm
      - run: git checkout -- packages/bsdiff/bsdiff.wasm
      # Conformance tests hand our patches to the reference bspatch.
      - run: sudo apt-get update && sudo apt-get install -y bsdiff
      - run: pnpm check
      - run: pnpm --filter dashboard lint
      - run: pnpm test
      - run: pnpm build
